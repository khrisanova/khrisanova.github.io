.wrap{width:min(100%,760px);margin:auto;padding:30px 18px 46px;position:relative}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;background:var(--glass);box-shadow:0 35px 100px rgba(0,0,0,.58);backdrop-filter:blur(22px)}
.cover{height:265px;position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;object-position:center 35%;display:block;filter:saturate(1.08) contrast(1.06)}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,3,9,.05),rgba(8,6,12,.2) 48%,#0d0912 100%)}
.profile{position:relative;padding:0 25px 27px;text-align:center}
.avatar{width:116px;height:116px;border-radius:50%;object-fit:cover;object-position:center 30%;display:block;margin:-58px auto 14px;border:4px solid #100b15;box-shadow:0 12px 42px #000b;position:relative;z-index:2}
.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid #fff2;border-radius:999px;background:#ffffff0c;color:#ddd;font-size:11px;letter-spacing:1.2px}
h1{margin:11px 0 2px;font-size:36px;letter-spacing:-1.3px}.handle{font-size:14px;color:#aaa6b1}
.bio{margin:13px auto 20px;max-width:500px;color:#d8d4dd;font-size:14px;line-height:1.55}
.socials{display:flex;justify-content:center;gap:9px;margin-bottom:23px}
.socials a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:#fff;background:#ffffff0b;border:1px solid #fff2;font-size:17px;transition:.22s}
.socials a:hover{transform:translateY(-3px) scale(1.04);background:#ffffff18}
.links{display:grid;gap:12px}.link{min-height:61px;display:flex;align-items:center;justify-content:center;padding:15px 52px;border-radius:18px;border:1px solid #fff2;background:#ffffff0a;color:#fff;text-decoration:none;font-weight:700;position:relative;box-shadow:0 10px 28px #0002;transition:.22s}
.link:hover{transform:translateY(-3px);background:#ffffff13;border-color:#fff4;box-shadow:0 16px 34px #0004}
.primary{border:0;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 14px 40px #9b5cff40}.primary:hover{filter:brightness(1.08)}
.icon{position:absolute;left:19px;width:25px;height:25px;display:grid;place-items:center;font-size:20px}
.section-title{text-align:left;margin:28px 2px 12px;color:#c2bdc9;font-size:12px;letter-spacing:1.8px;text-transform:uppercase}
.gallery{display:grid;grid-template-columns:1.15fr .85fr .85fr;grid-auto-rows:145px;gap:8px}
.photo{display:block;position:relative;overflow:hidden;border-radius:16px;border:1px solid #fff2;background:#17131d}
.photo img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .45s,filter .45s}.photo:hover img{transform:scale(1.06);filter:saturate(1.15)}
.photo:nth-child(1){grid-row:span 2}.photo:nth-child(5){grid-row:span 2}.photo:nth-child(8){grid-column:2/4}
.footer{text-align:center;color:#77727e;font-size:11px;margin-top:20px}
@media(max-width:700px){body:before{filter:saturate(.8) brightness(.38) blur(3px)}.wrap{padding:12px 10px 30px}.hero{border-radius:24px}.cover{height:225px}.profile{padding:0 15px 22px}.gallery{grid-template-columns:1.1fr .9fr;grid-auto-rows:135px}.photo:nth-child(1),.photo:nth-child(5){grid-row:span 2}.photo:nth-child(8){grid-column:1/-1}}
@media(max-width:430px){.cover{height:205px}.avatar{width:102px;height:102px;margin-top:-51px}h1{font-size:30px}.gallery{grid-auto-rows:120px}.link{min-height:57px;font-size:14px}}
