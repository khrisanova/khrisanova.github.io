<style>
:root{
  --bg:#08070b;--card:rgba(255,255,255,.075);--line:rgba(255,255,255,.13);
  --text:#fff;--muted:#aaa7b2;--pink:#ff4f9a;--violet:#9d63ff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
  radial-gradient(circle at 15% 0%,rgba(255,79,154,.18),transparent 30%),
  radial-gradient(circle at 90% 15%,rgba(157,99,255,.20),transparent 32%),
  #08070b;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;overflow-x:hidden;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 0%,rgba(0,0,0,.12) 100%);z-index:-1}
.wrap{width:min(100%,720px);margin:auto;padding:28px 18px 42px}
.hero{position:relative;border:1px solid var(--line);border-radius:30px;overflow:hidden;background:rgba(12,10,17,.78);box-shadow:0 30px 90px rgba(0,0,0,.5);backdrop-filter:blur(18px)}
.cover{height:245px;position:relative;overflow:hidden;background:#17111b}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,4,8,.02),rgba(5,4,8,.22) 45%,#0c0910 100%)}
.cover img{width:100%;height:100%;object-fit:cover;object-position:center 32%;display:block;filter:saturate(1.05) contrast(1.04)}
.profile{position:relative;padding:0 24px 25px;text-align:center}
.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;object-position:center 30%;display:block;margin:-58px auto 13px;border:4px solid #0c0910;box-shadow:0 12px 40px rgba(0,0,0,.65);position:relative;z-index:2}
.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(255,255,255,.06);font-size:11px;color:#ddd;letter-spacing:.4px}
h1{margin:11px 0 3px;font-size:34px;letter-spacing:-1.1px}
.handle{color:#aaa7b2;font-size:14px}
.bio{margin:13px auto 20px;color:#d7d4dc;font-size:14px;line-height:1.55;max-width:480px}
.socials{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:22px}
.socials a{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);font-size:17px;transition:.2s}
.socials a:hover{transform:translateY(-3px);background:rgba(255,255,255,.14)}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;justify-content:center;min-height:60px;padding:15px 54px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.065);color:#fff;text-decoration:none;font-weight:700;position:relative;transition:.22s;box-shadow:0 9px 30px rgba(0,0,0,.18)}
.link:hover{transform:translateY(-3px);background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.22);box-shadow:0 14px 35px rgba(0,0,0,.3)}
.link.primary{border:0;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 14px 38px rgba(157,99,255,.25)}
.link.primary:hover{filter:brightness(1.08)}
.icon{position:absolute;left:19px;width:25px;height:25px;display:grid;place-items:center;font-size:20px}
.gallery-title{text-align:left;margin:27px 2px 12px;font-size:13px;color:#bdb9c4;text-transform:uppercase;letter-spacing:1.8px}
.gallery{display:grid;grid-template-columns:1.2fr .8fr;grid-auto-rows:150px;gap:8px}
.photo{position:relative;border-radius:17px;overflow:hidden;border:1px solid rgba(255,255,255,.09);background:#151219}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s,filter .5s}
.photo:hover img{transform:scale(1.05);filter:saturate(1.12)}
.photo:nth-child(1){grid-row:span 2}
.photo:nth-child(4){grid-row:span 2}
.photo:nth-child(7){grid-column:1 / -1}
.footer{text-align:center;color:#706c76;font-size:11px;margin-top:22px}
@media(max-width:560px){
 .wrap{padding:12px 12px 30px}.cover{height:210px}.profile{padding:0 16px 20px}
 h1{font-size:30px}.avatar{width:102px;height:102px;margin-top:-52px}
 .gallery{grid-auto-rows:125px;gap:6px}.photo{border-radius:13px}
}
</style>
